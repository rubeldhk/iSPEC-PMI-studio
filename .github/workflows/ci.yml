# T010 + T048 — CI pipeline.
#
# test:arch is a first-class gate, not an afterthought: it is what keeps
# engine-independence (FR-017) and service/transport separation (PC-1) true.
# If it fails, the build fails.

name: CI

on:
  push:
    branches: [main, 'feature/**', 'epic/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # Constitution V — mandatory, never optional.
      - name: Unit tests
        run: pnpm test:unit

      # FR-017 / PC-1 — a violation fails the build, not a review.
      - name: Architecture tests
        run: pnpm test:arch

      - name: Contract tests
        run: pnpm test:contract
