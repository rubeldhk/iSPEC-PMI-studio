# T010 + T048 — CI pipeline.
#
# test:arch is a first-class gate, not an afterthought: it is what keeps
# engine-independence (FR-017) and service/transport separation (PC-1) true.
# If it fails, the build fails.

name: CI

on:
  push:
    branches: [main, 'feature/**', 'epic/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # DEF-027-005 — full history, deliberately.
      #
      # `actions/checkout@v4` defaults to `fetch-depth: 1`, a shallow clone of a
      # single commit. Two governance checks walk git history and are starved by
      # that:
      #
      #   G-27-09  proves EPIC-027 shipped no product source (SC-AMD-009) by
      #            walking `git log --all`. On a shallow clone it finds zero
      #            commits. It FAILS rather than passing, because T632 added an
      #            anti-vacuity assertion — without which it would have reported
      #            green in CI forever while examining nothing.
      #   G-10     compares the branch name to the epic being worked (D-39). On a
      #            shallow clone it degrades quietly to "no epic determinable".
      #
      # Do not "optimise" this back to a shallow clone without reading those two.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Prisma client is GENERATED code, and nothing else generates it.
      #
      # Without this step `@prisma/client` resolves to its ungenerated stub, which
      # exports no `PrismaClient` at all. Typecheck then fails in the integration
      # tests with TS2305 (no exported member 'PrismaClient') and TS7006 ('tx'
      # implicitly has an 'any' type) — errors about the schema being absent, not
      # about the code being wrong. It is the reason CI was red on 2026-08-21 and
      # 2026-08-22 while the same tree typechecked clean on every developer machine
      # that happened to have generated the client at some point.
      #
      # It belongs here rather than in a `postinstall`: a backend postinstall does
      # run, and reports success, but pnpm finalises the virtual store afterwards
      # and the generated output does not survive it.
      #
      # Every step below depends on this, not just Typecheck — the unit, contract
      # and integration suites import the same client.
      - name: Generate Prisma client
        run: pnpm --filter @pmi/backend exec prisma generate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # Constitution V — mandatory, never optional.
      - name: Unit tests
        run: pnpm test:unit

      # FR-017 / PC-1 — a violation fails the build, not a review.
      #
      # `:gated` excludes the architecture check that is red by design (`T999u`).
      # It is not skipped: the Known-red step below runs it and fails the build
      # if it is NOT red. `governance/known-red.json` is the list, and the README
      # §Known-red checks explains the arrangement.
      - name: Architecture tests
        run: pnpm test:arch:gated

      - name: Contract tests
        run: pnpm test:contract

      # EPIC-003 T688 / EPIC-004 T689 — the guarantees no unit test can reach.
      #
      # Convergence found these five files demonstrating criteria that nothing on a push
      # re-verified. EPIC-004's purpose is "audit immutability enforced by the database
      # rather than by convention": the `audit_entries_immutable` trigger fires inside
      # PostgreSQL, so a unit test CANNOT execute it — mocking the database would assert
      # the mock. `workspace-isolation.spec.ts` builds its SQL from the scoping helper's
      # own output so it fails by leaking rather than by shape, and `engine-swap.spec.ts`
      # is the only demonstration of SC-008.
      #
      # All five passed at each epic's closure and then went unrun for weeks. A regression
      # in tenancy isolation or audit immutability would have reached the default branch
      # green — the two failures a governed repository can least afford to discover late.
      #
      # Testcontainers needs a container runtime; GitHub-hosted runners provide one. Two of
      # the five files start a PostgreSQL container (~15s each); the other three need no
      # container and finish in milliseconds. Measured locally at 37s for the suite.
      - name: Integration tests
        run: pnpm test:integration

      # EPIC-018 T336 — governance conformance.
      #
      # These checks are what make Constitution V satisfiable for an epic that produces
      # documents rather than application code: a governance document no check reads is a
      # document that silently rots. Without this step the checks exist but never run.
      #
      # G-04 (no steering file restates constitution or template text) is the check that
      # earns a hard CI failure — duplicated text reads correctly the day it is written
      # and forks at the next amendment, leaving two sources of truth and no signal that
      # they disagree. G-07 staleness reports in the log and does not fail; see
      # governance/README.md for the severity split.
      #
      # The checks live outside every workspace package, so `pnpm -r typecheck` does not
      # reach them. Typechecking them explicitly is the same rule they assert of everything
      # else — see steering/technology-stack.md TS-004.
      # `:gated` excludes the governance check that is red by design (`T884`),
      # on the same terms as the architecture step above.
      - name: Governance checks
        run: |
          pnpm typecheck:governance
          pnpm test:governance:gated

      # The two checks the steps above leave out, run on their own and asserted
      # to be STILL RED (2026-10-01).
      #
      # `T884` waits on a human screen-reader pass and `T999u` on a keyboard-only
      # Tier 2 journey. Both sat in the steps above, so the job stopped at the
      # first of them and the Contract, Integration and Governance steps never
      # ran — three suites unexecuted on every push to keep two obligations
      # visible. A regression in tenancy isolation or audit immutability would
      # have reached the default branch unexamined, which is the trade the step
      # ordering was quietly making.
      #
      # This keeps the obligation asserted rather than merely documented: the
      # gate's exit code is INVERTED, so it fails the build the day one of them
      # passes and tells you to retire the entry. It is not `continue-on-error`,
      # and it must not become it — that would turn the gate back into a comment.
      #
      # LAST on purpose: the day it legitimately fails, everything it unblocked
      # has already run and reported.
      - name: Known-red checks
        run: pnpm test:known-red
