# T009 — local services.
#
# Valkey rather than Redis: Redis relicensed away from BSD in 2024, which is a
# commercial-redistribution exposure for this platform. Valkey is the BSD fork
# and speaks the same protocol, so BullMQ and ioredis are unchanged.
# See ADR-0003 and RAID R-03.

services:
  postgres:
    image: pgvector/pgvector:pg16  # EPIC-038 T1221 — pgvector >= 0.8.0 (R-038-2)
    container_name: pmi-postgres
    environment:
      POSTGRES_USER: pmi
      POSTGRES_PASSWORD: pmi_local_dev
      POSTGRES_DB: pmi_studio
    ports:
      # Host port is configurable: developer machines often already run a
      # Postgres. The container port never changes.
      - '${PMI_POSTGRES_PORT:-5432}:5432'
    volumes:
      - pmi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pmi -d pmi_studio']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:7-alpine
    container_name: pmi-valkey
    ports:
      - '${PMI_VALKEY_PORT:-6379}:6379'
    volumes:
      - pmi-valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # T150k (EPIC-014 F-11.3) — the application: the API and the built web client,
  # on ONE origin. There is no web container and no reverse proxy; the client
  # assumes `/v1` is same-origin and here it simply is (`R-014-1`).
  #
  # The two services above are NOT reshaped by this Epic — their images,
  # volumes, healthchecks and port variables were already correct
  # (contracts/container-stack.md §1).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # **Named explicitly** (`T150r`). A service with `build:` and no `image:`
    # is named from the compose PROJECT — which defaults to the directory —
    # so the image name differs per checkout and cannot be written into
    # documentation. `quickstart.md` Scenario 5 named `pmi-studio-app`, which
    # existed nowhere, and that scenario is the credential check's own.
    image: pmi-studio-app
    container_name: pmi-app
    depends_on:
      # `service_healthy`, not `service_started`. A container that starts before
      # Postgres accepts connections fails its migration step, which is the
      # loud failure of R-014-5 arriving for the wrong reason.
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      # Supplied, never baked. The image knows nothing about these hosts, and
      # T150a refuses a literal secret in this file.
      DATABASE_URL: postgresql://pmi:pmi_local_dev@postgres:5432/pmi_studio
      VALKEY_URL: redis://valkey:6379
      PORT: 3000
      # Passed through from the developer's .env. An EMPTY value is not the
      # same as an absent one to the shell, but it is to the engine: the
      # sandbox refuses to start either way.
      AI_PROVIDER_TOKEN: ${AI_PROVIDER_TOKEN:-}
      # T1311 (EPIC-041 F-041.1) — the projects root, in both of its names
      # (`R-041-2`). The API writes under PMI_PROJECTS_ROOT, which is the mount
      # below; PMI_PROJECTS_ROOT_HOST is the same directory as the developer's
      # machine sees it, and is what a project's rootPath stores and every
      # screen shows. A container cannot infer either the host path or the
      # address the host reaches it at, so both are supplied, never guessed.
      PMI_PROJECTS_ROOT: /projects
      PMI_PROJECTS_ROOT_HOST: ${PMI_PROJECTS_ROOT_HOST:?set PMI_PROJECTS_ROOT_HOST to the directory your projects live in}
      PMI_PUBLIC_URL: ${PMI_PUBLIC_URL:-http://localhost:${PMI_APP_PORT:-3000}}
      PMI_ENGINE_TAG: ${PMI_ENGINE_TAG:-v0.16.4}
      PMI_MCP_SERVER_VERSION: ${PMI_MCP_SERVER_VERSION:-0.1.0}
      PMI_INITIALISE_WAIT_MS: ${PMI_INITIALISE_WAIT_MS:-30000}
      PMI_DEFAULT_AGENT_INTEGRATION: ${PMI_DEFAULT_AGENT_INTEGRATION:-}
      PMI_DEFAULT_SCRIPT_TYPE: ${PMI_DEFAULT_SCRIPT_TYPE:-sh}
    ports:
      - '${PMI_APP_PORT:-3000}:3000'
    volumes:
      # The one line that lets the containerised stack write a directory the
      # user can open (`FR-LPW-001`). Required, not defaulted: a default such as
      # `./projects` would silently create directories inside the checkout.
      - '${PMI_PROJECTS_ROOT_HOST:?set PMI_PROJECTS_ROOT_HOST to the directory your projects live in}:/projects'

volumes:
  pmi-postgres-data:
  pmi-valkey-data:
